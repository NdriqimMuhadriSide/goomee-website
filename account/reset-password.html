<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try { var t = localStorage.getItem('goomee-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set a new password | Goomee</title>
  <!-- Reached only from an account email, and carries a one-time token. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FAF9F6">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/jakarta-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/styles.css?v=5d6de11370">
  <script src="/assets/main.js?v=08e2a93927" defer></script>
  <script src="/assets/account.js?v=2" defer></script>
  <style>
    /* The show/hide button sits inside the field, on the right. */
    .pw-wrap { position: relative; }
    .pw-wrap input { width: 100%; padding-right: 52px; box-sizing: border-box; }
    .pw-toggle { position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
      width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted, #6B7A88); cursor: pointer; }
    .pw-toggle:hover { color: var(--ink, #0A1F3D); }
    .pw-toggle:focus-visible { outline: 2px solid #FD5F06; outline-offset: 1px; }
    .pw-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round; }
    .pw-toggle .eye-closed { display: none; }
    .pw-toggle[aria-pressed="true"] .eye-open { display: none; }
    .pw-toggle[aria-pressed="true"] .eye-closed { display: block; }
  </style>
</head>
<body class="legal-page" data-account-page="reset">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header" id="top">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="Goomee — let life find you">
        <span class="wordmark"><span class="wm-a">Goo</span><span class="wm-b">mee</span><svg class="wm-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v5M4.5 5 8 8.5M19.5 5 16 8.5"/></svg></span>
        <span class="brand-tag">Let life find you.</span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <article class="wrap legal">
      <header class="legal-head">
        <h1 id="title" data-t="resetTitle">Set a new password</h1>
      </header>
      <p id="body" data-t="resetIntro">Choose a new password for your Goomee account.</p>
      <noscript><p>This page needs JavaScript to change your password.</p></noscript>

      <form class="contact-form" id="reset-form" novalidate>
        <div class="field">
          <label for="r-password" data-t="newPassword">New password</label>
          <div class="pw-wrap">
            <input id="r-password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="r-hint">
            <button class="pw-toggle" type="button" data-toggle="r-password" aria-controls="r-password" aria-pressed="false" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
          <small id="r-hint" data-t="hint">At least 8 characters.</small>
        </div>
        <div class="field">
          <label for="r-repeat" data-t="repeatPassword">Repeat the new password</label>
          <div class="pw-wrap">
            <input id="r-repeat" name="repeat" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
            <button class="pw-toggle" type="button" data-toggle="r-repeat" aria-controls="r-repeat" aria-pressed="false" aria-label="Show password"><svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
        </div>
        <button class="btn btn-orange btn-lg" type="submit" data-t="save">Save new password</button>
        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-fine">
      <p class="legal-id">High Five International SRL &middot; Diepestraat 2 bus B, 1640 Sint-Genesius-Rode, Belgium &middot; Enterprise no. 0742.937.252</p>
    </div>
  </footer>
</body>
</html>
